name: Publish WIT packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-wit-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [extension, keyvalue-ttl, portal]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PACKAGE: ${{ matrix.package }}
      OCI_REPOSITORY: ghcr.io/nero-app/nero/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is on main
        if: github.event_name == 'release'
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Release tag must point to a commit included in main." >&2
            exit 1
          fi

      - name: Read package version
        id: package
        run: |
          version=$(sed -n "s/^package nero:$PACKAGE@\([^;]*\);$/\1/p" "definitions/$PACKAGE/wit/world.wit")
          if [[ -z "$version" ]]; then
            echo "Missing package version in world.wit" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@422f3094be6a0843857aa008b499caaf6bce0da8 # v1.24.0

      - name: Install wkg
        run: cargo binstall -y wkg@0.16.1

      - name: Build WIT package
        working-directory: definitions/${{ matrix.package }}/wit
        run: |
          wkg build --wit-dir . --output "$GITHUB_WORKSPACE/nero-$PACKAGE.wasm"
          git diff --exit-code -- wkg.lock

      - name: Upload preview package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: nero-${{ matrix.package }}-${{ steps.package.outputs.version }}
          path: nero-${{ matrix.package }}.wasm
          if-no-files-found: error

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check published version
        if: github.event_name == 'release'
        id: existing
        env:
          VERSION: ${{ steps.package.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          reference="$OCI_REPOSITORY:$VERSION"
          if gh api --paginate \
            "/orgs/nero-app/packages/container/nero%2F$PACKAGE/versions" \
            --jq '.[] | .metadata.container.tags[]?' \
            > "$RUNNER_TEMP/published-tags" 2> "$RUNNER_TEMP/registry-error"; then
            if grep -Fxq -- "$VERSION" "$RUNNER_TEMP/published-tags"; then
              wkg oci pull "$reference" --output "$RUNNER_TEMP/published.wasm"
              if ! cmp --silent "nero-$PACKAGE.wasm" "$RUNNER_TEMP/published.wasm"; then
                echo "$reference already exists with different content. Increment the WIT package version." >&2
                exit 1
              fi
              echo "$reference is already published with the same content; skipping."
              echo 'publish=false' >> "$GITHUB_OUTPUT"
            else
              echo 'publish=true' >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$(< "$RUNNER_TEMP/registry-error")" == *"(HTTP 404)" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/registry-error" >&2
            exit 1
          fi

      - name: Publish to GitHub Container Registry
        if: github.event_name == 'release' && steps.existing.outputs.publish == 'true'
        id: publish
        uses: bytecodealliance/wkg-github-action@10b3b04b9059ba46208cd7daf7d352af14bded0f # v5
        with:
          oci-reference-without-tag: ${{ env.OCI_REPOSITORY }}
          file: nero-${{ matrix.package }}.wasm
          description: Nero ${{ matrix.package }} WIT interfaces
          source: https://github.com/nero-app/nero-extension
          version: ${{ steps.package.outputs.version }}

      - name: Attest build provenance
        if: github.event_name == 'release' && steps.existing.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.OCI_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
